<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kauai Trip</title>
    <!-- Inline icon: an island in the sea (avoids a favicon.ico 404) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23a9d8f2'/%3E%3Cpath d='M9 21c1-6 5-11 10-12 3 0 5 3 4 7-1 5-6 8-10 8-2 0-4-1-4-3z' fill='%234f9a62'/%3E%3C/svg%3E" />


    <!-- Home Screen app -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#138066" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kauai" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Stylesheets load without blocking the first paint; they swap in when ready. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <link rel="preload" as="style" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    </noscript>

    <!-- defer: download in parallel, run in order after the page is parsed and before the app module. -->
    <script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <link href="/styles/main.css" rel="stylesheet" />
  </head>
  <body>
    <div id="map" aria-label="Map of Kauai"></div>
    <div class="top-bar">
      <header class="title-bar">
        <span class="title">Kauai Trip</span>
      </header>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
