<!doctype html>
<html class="staticrypt-html" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- do not cache this page -->
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Kauai Trip password screen: matches the map's palette (see styles/main.css). -->
    <style>
      :root {
        --accent: #1ba684;
        --ink: #1a1a1a;
        --muted: #5b6b60;
        --border: #d5ddd6;
        --deep: #a9d8f2;
        --mid: #c6e7f7;
        --shore: #e8f6fc;
        --land: #4f9a62;
        --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      .staticrypt-html, .staticrypt-body { height: 100%; margin: 0; }
      .staticrypt-body {
        font-family: var(--font);
        color: var(--ink);
        /* Ocean depth rings, like the map around the island */
        /* Circles sized to the short side, so they stay round on tall phones */
        background:
          radial-gradient(circle at 50% 45%, var(--shore) 0 34vmin, var(--mid) 34vmin 58vmin, var(--deep) 58vmin) fixed;
        -webkit-font-smoothing: antialiased;
      }
      .hidden { display: none !important; }

      .staticrypt-content {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px 16px calc(env(safe-area-inset-bottom) + 24px);
      }
      .staticrypt-form {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px 24px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 8px 32px rgba(23, 70, 60, 0.18);
      }
      .staticrypt-title {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: var(--accent);
      }
      .staticrypt-instructions { margin: 6px 0 20px; color: var(--muted); font-size: 15px; font-weight: 600; }

      .staticrypt-password-container { position: relative; margin-bottom: 14px; }
      #staticrypt-password {
        width: 100%;
        min-height: 48px;
        padding: 12px 64px 12px 14px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        background: #f6f9f7;
        font: 600 16px var(--font); /* 16px stops iOS zooming in */
        color: var(--ink);
        outline: none;
      }
      #staticrypt-password:focus { border-color: var(--accent); background: #fff; }
      .staticrypt-toggle {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        min-height: 36px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--muted);
        font: 800 13px var(--font);
        cursor: pointer;
      }

      .staticrypt-error {
        margin: -4px 0 12px;
        color: #b42318;
        font-size: 14px;
        font-weight: 700;
      }

      label.staticrypt-remember {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        margin-bottom: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .staticrypt-remember input { width: 20px; height: 20px; accent-color: var(--accent); }

      .staticrypt-decrypt-button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: 800 16px var(--font);
        cursor: pointer;
      }
      .staticrypt-decrypt-button:hover, .staticrypt-decrypt-button:focus-visible { filter: brightness(0.93); }

      .staticrypt-spinner-container { height: 100%; display: grid; place-items: center; }
      .staticrypt-spinner {
        width: 2rem;
        height: 2rem;
        border: 0.25em solid var(--accent);
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container">
      <div class="staticrypt-spinner"></div>
    </div>

    <div id="staticrypt_content" class="staticrypt-content hidden">
      <form id="staticrypt-form" class="staticrypt-form" action="#" method="post">
        <h1 class="staticrypt-title">/*[|template_title|]*/0</h1>
        <p class="staticrypt-instructions">/*[|template_instructions|]*/0</p>

        <div class="staticrypt-password-container">
          <input
            id="staticrypt-password"
            type="password"
            name="password"
            placeholder="/*[|template_placeholder|]*/0"
            aria-label="/*[|template_placeholder|]*/0"
            autocomplete="current-password"
            autofocus
          />
          <button type="button" class="staticrypt-toggle" aria-pressed="false">/*[|template_toggle_show|]*/0</button>
        </div>

        <p id="staticrypt-error" class="staticrypt-error hidden" role="alert"></p>

        <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember" />
          /*[|template_remember|]*/0
        </label>

        <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
      </form>
    </div>

    <script>
      // StaticCrypt engine wiring (from staticrypt/lib/password_template.html, v3.5.4).
      // These variables are filled when generating the file; format '/*[|variable_name|]*/0'.
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        templateToggleAltShow = "/*[|template_toggle_show|]*/0",
        templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      // Try to decrypt on load from a remembered device; otherwise show the form.
      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();
          if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
          }
        }
      };

      // Show / Hide password text
      const toggle = document.querySelector(".staticrypt-toggle");
      toggle.addEventListener("click", function () {
        const input = document.getElementById("staticrypt-password");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        toggle.textContent = show ? templateToggleAltHide : templateToggleAltShow;
        toggle.setAttribute("aria-pressed", String(show));
        input.focus();
      });

      // Submit: inline error instead of a browser alert.
      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const error = document.getElementById("staticrypt-error");
        error.classList.add("hidden");
        const password = document.getElementById("staticrypt-password").value,
          isRememberChecked = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
        if (!isSuccessful) {
          error.textContent = templateError;
          error.classList.remove("hidden");
          document.getElementById("staticrypt-password").select();
        }
      });
    </script>
  </body>
</html>
